name: 📝 Pytest

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  install-and-pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - "3.8"
        - "3.9"
        - "3.10"
        - "3.11"
        - "3.12"
        - "3.13"
        - "3.14"
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies (minimum pydantic)
      run: |
        uv sync --dev
        uv pip install "pydantic==2.0;  python_version <  '3.12'" \
                        "pydantic==2.4;  python_version >= '3.12' and python_version < '3.13'" \
                        "pydantic==2.8;  python_version >= '3.13' and python_version < '3.14'" \
                        "pydantic==2.12; python_version >= '3.14'"
        uv pip freeze
    - name: Test with pytest (minimum pydantic)
      run: |
        uv run pytest
    - name: "Install latest pydantic"
      run: |
        uv pip install --upgrade pydantic
        uv pip freeze
    - name: Test with pytest (latest pydantic)
      run: |
        uv run pytest
