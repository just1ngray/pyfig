[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyfig"]
exclude = ["*_test.py"]

[project]
name = "jpyfig"
version = "0.3.1"
description = "Configuration library built around pydantic"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Justin Gray", email = "just1ngray@outlook.com" }
]
dependencies = [
    "pydantic>=2.0.0,<3.0.0"
]
requires-python = ">=3.8"

[project.urls]
Homepage = "https://github.com/just1ngray/pyfig"

[tool.pytest.ini_options]
addopts = "--cov --cov-report term-missing --no-cov-on-fail"
console_output_style = "count"

[tool.coverage.run]
omit = ["*_test.py"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "pytest-sugar>=1.1.1",
    "pytestdir",
    "pyyaml>=6.0.3",
    "sympy>=1.13.3",
    "toml>=0.10.2",
]

[tool.uv.sources]
pytestdir = { git = "https://github.com/just1ngray/pytestdir.git" }
