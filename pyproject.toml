##
# Project build
##

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyfig"]
exclude = ["*_test.py"]

[tool.hatch.version]
source = "vcs"

##
# Project metadata
##

[project]
name = "jpyfig"
dynamic = ["version"]
description = "Configuration library built around pydantic"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Justin Gray", email = "just1ngray@outlook.com" }
]
dependencies = [
    "pydantic>=2.0.0,<3.0.0"
]
requires-python = ">=3.8"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/just1ngray/pyfig"

[project.optional-dependencies]
yaml = ["pyyaml"]
tomli = ["tomli; python_version < '3.11'"]
toml = ["toml; python_version < '3.11'"]
sympy = ["sympy"]
all = ["jpyfig[yaml,tomli,sympy]"]

##
# Development, tooling, etc.
##

[tool.pytest.ini_options]
addopts = "--cov --cov-report term-missing --no-cov-on-fail"
console_output_style = "count"

[tool.coverage.run]
omit = ["*_test.py"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "pytest-sugar>=1.1.1",
    "pytestdir",

    "jpyfig[all]",
    "pyyaml>=6.0.3",
    "sympy>=1.13.3",
    "toml>=0.10.2",
    "tomli>=2.4.1",
]

[tool.uv.sources]
pytestdir = { git = "https://github.com/just1ngray/pytestdir.git" }
